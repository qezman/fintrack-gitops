apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: fintrack-cluster
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/qezman/fintrack-gitops
    targetRevision: HEAD
    path: manifests/cluster
  destination:
    server: https://kubernetes.default.svc
    namespace: fintrack
  syncPolicy:
    automated:
      prune: true
      selfHeal: true