apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: disallow-root-containers
  annotations:
    policies.kyverno.io/title: Disallow Root Containers
    policies.kyverno.io/category: Pod Security Standards (Restricted)
    policies.kyverno.io/severity: medium
    policies.kyverno.io/description: >-
      Containers should not run as root. This policy validates that
      runAsNonRoot is set to true, or runAsUser is set to a non-zero value.
spec:
  validationFailureAction: Audit
  background: true
  rules:
    - name: run-as-non-root
      match:
        any:
          - resources:
              kinds:
                - Pod
              namespaces:
                - fintrack
      validate:
        message: "Running as root is not allowed. Set runAsNonRoot: true or runAsUser to a non-zero value."
        pattern:
          spec:
            =(securityContext):
              =(runAsNonRoot): "true"