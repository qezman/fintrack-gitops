apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: fintrack-backend
  namespace: fintrack
  labels:
    app: fintrack-backend
spec:
  replicas: 2
  strategy:
    canary:
      steps:
        - setWeight: 20
        - pause:
            duration: 30s
        - setWeight: 50
        - pause:
            duration: 30s
        - setWeight: 100
  selector:
    matchLabels:
      app: fintrack-backend
  template:
    metadata:
      labels:
        app: fintrack-backend
    spec:
      serviceAccountName: fintrack-backend

      containers:
        - name: backend
          image: 560205084952.dkr.ecr.us-east-1.amazonaws.com/fintrack-backend:281fc3137918810fd06b0d5253d33ec25ff9bbac
          ports:
            - containerPort: 3001

          env:
            - name: PORT
              value: "3001"
            - name: AWS_REGION
              value: "us-east-1"
            - name: AWS_S3_BUCKET_NAME
              value: "fintrack-dev-receipts-560205084952"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: fintrack-backend-secrets
                  key: DATABASE_URL
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: fintrack-backend-secrets
                  key: JWT_SECRET

          livenessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 3

          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "200m"